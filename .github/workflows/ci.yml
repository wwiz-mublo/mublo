name: CI

# 문서·이미지만 바뀐 변경은 무거운 검사를 건너뛴다. 마크다운은 어떤 테스트도
# 깨뜨릴 수 없다.
#
# 다만 pull_request 에는 paths-ignore 를 쓰지 않는다. 워크플로 자체가 건너뛰어지면
# 체크가 아예 생성되지 않고, 브랜치 보호의 필수 체크(PHP 8.2/8.3/8.4)가 영원히
# pending 으로 남아 문서만 고치는 PR 은 머지가 불가능해진다. workflow_dispatch 로
# 수동 실행해도 그 체크 스위트는 PR 에 연결되지 않아 소용이 없다(2026-08-07 #21
# 에서 확인). 그래서 워크플로는 항상 돌리고, 아래 changes 잡의 판정으로 잡 안의
# 무거운 스텝만 건너뛴다.
#
# push 는 필수 체크와 무관하므로 종전처럼 paths-ignore 로 통째로 거른다.
#
# 제외 목록은 "실행에 영향이 없는 것" 만 담는다. 예를 들어 .github/workflows 는
# 넣지 않는다 — CI 자신을 고치는 변경이야말로 검증이 필요하다.
#
# main push 는 PR 실행의 복사본이라 PHP 8.2 + static 만 돌린다(DB compatibility
# 제외, 아래 각 잡의 주석 참고). 머지 1건 컴퓨트 약 19분 → 7.5분.
#
# 잡 구성(2026-09-09 실측, PR 1회 기준):
#   changes                 5초   변경 판정
#   static                 ~90초  PHPStan 2종. 결과 캐시가 맞으면 ~30초
#   PHP 8.2/8.3/8.4        ~55초  검사 5종 + PHPUnit(실 DB)
#   migration-immutability  5초
#   DB compatibility ×4    ~40초  대부분 컨테이너 기동
# 병목은 static 또는 PHP 잡이고, 컨테이너 기동·PHP 설치·스케줄링 대기가 바닥이라
# 벽시계 1분 남짓 아래로는 내려가지 않는다.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.svg'
  pull_request:
    branches: [ main ]
  # 임의 브랜치/커밋을 수동으로 검증할 때 사용한다.
  #   gh workflow run ci.yml --ref <브랜치>
  workflow_dispatch:

jobs:
  # 이 PR 에 코드가 한 줄이라도 섞였는지 판정한다. pull_request 가 아니면
  # (push·workflow_dispatch) 무조건 돈다 — 판정 대상 범위가 없다.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "pull_request 가 아니므로 전체 실행"
            exit 0
          fi

          FILES=$(git diff --name-only "$BASE" "$HEAD")
          echo "변경 파일:"
          echo "$FILES" | sed 's/^/  /'

          # 한 줄이라도 제외 목록 밖이면 코드 변경으로 본다.
          if echo "$FILES" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$|\.(png|jpg|svg)$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "→ 코드 변경 있음, 전체 실행"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "→ 문서·이미지 변경뿐, 무거운 검사 생략"
          fi

  # PHPStan 은 소스만 읽고 실행하지 않으며, composer.json 의 platform 이 8.2.0 으로
  # 고정돼 있어 PHP 버전을 바꿔 돌려도 결과가 같다. 그래서 PHP 매트릭스에서 빼
  # 한 번만 돌린다 — 매트릭스 안에 있을 때는 PHP 잡 시간의 절반 이상이 이 두
  # 스텝의 중복이었다(잡당 ~75초 × 3).
  #
  # 결과 캐시: PHPStan 은 tmpDir 에 파일별 분석 결과를 남기고, 다음 실행에서 바뀐
  # 파일과 그 의존 파일만 다시 본다. tmpDir 은 phpstan*.neon.dist 가 .cache/ 아래로
  # 고정한다. 두 설정이 같은 디렉토리를 쓰면 서로의 캐시를 무효화하므로 따로 둔다.
  # 키에 sha 를 넣어 매번 새로 저장하고, restore-keys 로 가장 최근 것을 받는다.
  # composer.lock 이나 phpstan 설정이 바뀌면 캐시를 버린다 — PHPStan 자체도 설정
  # 해시가 다르면 무시하지만, 그 경우 복원 자체가 시간 낭비다.
  #
  # 필수 체크가 아니라 skipped 로 남아도 머지를 막지 않는다.
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli, mbstring, openssl, json, curl, fileinfo, gd, zip, xml, intl
          coverage: none

      # PHP 8.2 테스트 잡과 같은 키라 vendor 캐시를 공유한다.
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.2-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Cache PHPStan result
        uses: actions/cache@v6
        with:
          path: |
            .cache/phpstan
            .cache/phpstan-strict
          key: phpstan-${{ hashFiles('composer.lock', 'phpstan.neon.dist', 'phpstan-strict.neon.dist') }}-${{ github.sha }}
          restore-keys: phpstan-${{ hashFiles('composer.lock', 'phpstan.neon.dist', 'phpstan-strict.neon.dist') }}-

      # 정적분석 level 0 — "부르는데 없는" 클래스·인터페이스·메서드를 잡는다.
      # 오탐 0건이라 베이스라인 없이 게이트로 쓴다. 설정은 phpstan.neon.dist.
      - name: Run static analysis
        run: composer analyse

      # 정리가 끝난 범위(코어·Board·Shop·플러그인, 뷰 제외)만 level 3 으로 본다.
      # level 2 부터 "아무 객체에나 없는 메서드 호출"을 잡는다.
      - name: Run static analysis (strict scope)
        run: composer analyse-strict

  # 필수 체크 3종(PHP 8.2/8.3/8.4)이다. 잡 레벨 if 로 건너뛰면 결론이 skipped 가
  # 되는데, 필수 체크를 skipped 로 두는 것이 통과로 인정되는지는 보호 규칙 설정에
  # 따라 달라진다. 머지 가능 여부가 걸린 자리라 추측하지 않는다 — 잡은 항상 돌려
  # success 로 보고하고, 안의 무거운 스텝만 건너뛴다.
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: changes

    strategy:
      fail-fast: false
      matrix:
        # main push 는 PR 에서 방금 통과한 트리를 다시 검사하는 자리다(squash merge
        # 만 허용, PR 체크는 merge ref 로 돈다). 마지막 PR 실행 뒤 main 이 움직인
        # 경우만 잡으면 되므로 하한 8.2 하나로 줄인다. PR 과 workflow_dispatch 는
        # 필수 체크 3종을 그대로 돌린다.
        php: ${{ fromJSON(github.event_name == 'push' && '["8.2"]' || '["8.2", "8.3", "8.4"]') }}

    # 통합 테스트용 DB. 없으면 tests/Integration 은 스킵되므로,
    # 리포지토리 계층의 SQL 이 검증되지 않은 채 통과한다.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mublo_integration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        if: needs.changes.outputs.code == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, openssl, json, curl, fileinfo, gd, zip, xml, intl
          coverage: none

      # v4 는 Node.js 20 을 타깃해 러너가 24 로 강제 실행하며 폐기 경고를 낸다.
      # v5 부터 node24 다. path/key/restore-keys 는 그대로다.
      - name: Cache Composer dependencies
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: composer install --no-interaction --prefer-dist

      # 배포되는 운영 의존성의 알려진 취약점을 차단(dev 도구 CVE는 사용자 배포물에 없으므로 제외).
      - name: Security audit (production deps)
        if: needs.changes.outputs.code == 'true'
        run: composer audit --no-dev

      - name: Run DI check
        if: needs.changes.outputs.code == 'true'
        run: composer check-di

      # 확장이 안정 API 밖의 코어 심볼에 새로 의존하는 것을 막는다.
      # 기존 의존은 tools/extension-api-baseline/*.json 에 동결되어 있다.
      - name: Run extension API check
        if: needs.changes.outputs.code == 'true'
        run: composer check-extension-api

      # 위 검사는 확장이 "적은 이름"만 본다. 이벤트가 엔티티를 반환하면 확장은 use 문 없이
      # 그 엔티티에 묶이고, 그 의존은 위 검사에 보이지 않는다. 생산자 쪽에서 막는다 —
      # 안정 이벤트의 게터가 안정 API 밖의 타입을 반환하면 실패한다.
      # 기존 노출은 tools/event-payload-baseline.json 에 동결되어 있다.
      - name: Run event payload check
        if: needs.changes.outputs.code == 'true'
        run: composer check-event-payload

      # 런타임 파일이 declare(strict_types=1) 을 빠뜨리지 않게 한다.
      # strict_types 는 "선언한 파일에서 나가는 호출"에만 적용되므로,
      # 한 파일이라도 빠지면 그 파일의 호출은 다시 조용히 형변환된다.
      - name: Run strict types check
        if: needs.changes.outputs.code == 'true'
        run: composer check-strict-types

      # PHPStan 은 위 static 잡에서 한 번만 돈다.

      # DB_TEST_* 가 있으면 tests/Integration 이 실 DB 를 태운다(없으면 스킵).
      # 리포지토리·QueryBuilder 의 SQL 은 mock 으로는 검증되지 않는다.
      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        run: composer test
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: 3306
          DB_TEST_USER: root
          DB_TEST_PASS: root
          DB_TEST_NAME: mublo_integration_test

  # 이미 실행된 마이그레이션 파일을 고치면, 그 파일을 이미 돌린 설치본에서
  # checksum 드리프트가 나고 해당 확장의 활성화가 막힌다. 실제로 주석 한 줄을
  # 지운 문구 정리 커밋 때문에 Shop 활성화가 조용히 실패한 적이 있다.
  # SQL 이 안 바뀌어도 파일이 바뀌면 해시가 달라진다 — 주석도 파일 내용이다.
  migration-immutability:
    name: Migration immutability
    runs-on: ubuntu-latest
    needs: changes
    # 필수 체크가 아니라 skipped 로 남아도 머지를 막지 않는다.
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout (비교를 위해 전체 이력)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 기존 마이그레이션 파일 수정 검사
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # 신규 추가(A)는 통과, 기존 파일 수정(M)만 잡는다.
          MODIFIED=$(git diff --diff-filter=M --name-only "$BASE" "$HEAD" \
            -- '*database/migrations/*.sql' || true)

          if [ -z "$MODIFIED" ]; then
            echo "✓ 수정된 마이그레이션 파일 없음"
            exit 0
          fi

          # 드리프트 복구처럼 파일을 되돌리는 것이 정답인 경우가 있다.
          # 그때는 커밋 메시지에 [migration-edit] 를 남겨 의도를 밝힌다.
          if git log --format=%B "$BASE..$HEAD" | grep -qF '[migration-edit]'; then
            echo "⚠ 마이그레이션 파일이 수정되었으나 [migration-edit] 로 승인됨:"
            echo "$MODIFIED"
            exit 0
          fi

          echo "✗ 이미 배포된 마이그레이션 파일이 수정되었습니다."
          echo ""
          echo "$MODIFIED"
          echo ""
          echo "이 파일을 이미 실행한 설치본에서는 checksum 이 어긋나 확장 활성화가 막힙니다."
          echo "SQL 을 바꾸지 않았더라도(주석·공백 포함) 파일이 바뀌면 해시가 달라집니다."
          echo ""
          echo "해결:"
          echo "  - 스키마를 바꾸려면 → 이 파일을 되돌리고 새 번호 마이그레이션을 추가하세요."
          echo "  - 문구만 고치려면 → 되돌리세요. 배포된 마이그레이션의 주석은 고치지 않습니다."
          echo "  - 드리프트 복구처럼 수정이 정답이면 → 커밋 메시지에 [migration-edit] 를 넣으세요."
          echo ""
          echo "규정: docs/dev-guide/extension-requirements.md §2"
          exit 1

  database-compatibility:
    name: DB compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: changes
    # 필수 체크가 아니라 skipped 로 남아도 머지를 막지 않는다.
    # main push 에서는 돌리지 않는다. 마이그레이션은 PR 에서 이미 4종 DB 로
    # 검증됐고, 그 뒤 main 이 움직였어도 마이그레이션 파일끼리 충돌하면 위 PHP
    # 잡의 통합 테스트가 먼저 깨진다. 4잡 × ~40초 중 실제 검사는 1~3초고 나머지는
    # 컨테이너 기동이라, 같은 검사를 두 번 사는 비용이 크다.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 5.7
            image: mysql:5.7
          - name: MySQL 8.4 LTS
            image: mysql:8.4
          - name: MariaDB 10.3
            image: mariadb:10.3
          - name: MariaDB 10.11 LTS
            image: mariadb:10.11

    services:
      database:
        image: ${{ matrix.image }}
        env:
          # 두 이미지 계열이 이해하는 이름을 함께 주되 값은 동일하게 유지한다.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mublo_compatibility_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: mublo_compatibility_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      # DB 하한 호환성은 지원 PHP 하한에서 검증해 불필요한 교차 매트릭스를 피한다.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli, mbstring, openssl, json, curl, fileinfo, gd, zip, xml, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-db-compat-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # 연결 실패/지원 버전 미달/마이그레이션 오류는 skip이 아니라 즉시 실패한다.
      - name: Run fresh-install and upgrade migration smoke test
        run: composer check-db-compat
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: 3306
          DB_TEST_USER: root
          DB_TEST_PASS: root
          DB_TEST_NAME: mublo_compatibility_test
