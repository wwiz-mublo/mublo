<!--
    basic 스킨 편집 시드 (Header)

    도메인 프레임 편집을 처음 시작할 때 에디터에 로드되는 출발점 HTML.
    {{...}} 템플릿 문자열은 렌더 시점에 코어가 치환한다 — 목록은 편집기의
    변수 팔레트 또는 storage/docs/Mublo_Domain_Frame_Editing_Implementation_Plan.md §3.1 참고.

    모바일 토글 버튼(#mubloPanelToggle)과 {{mobile_panel}}은 한 쌍이다 —
    둘 중 하나만 지우면 모바일 메뉴가 동작하지 않는다.
-->
<header class="mublo-header">
    <div class="mublo-container">
        <div class="mublo-header__inner">

            <!-- 로고: 이미지 로고를 쓰려면 아래 span을
                 <img src="{{logo_url}}" alt="{{site_name}}" class="logo-img">로 교체 -->
            <div class="mublo-header__logo">
                <a href="/" class="logo-link">
                    <span class="logo-text--main">{{site_name}}</span>
                </a>
            </div>

            <!-- GNB (PC) -->
            <nav class="mublo-header__nav" id="main-nav">
                <div class="nav-wrapper">
                    {{menu_main}}
                </div>
            </nav>

            <!-- 검색 (PC).
                 직접 수정하고 싶으면 {{search}}를 폼 HTML로 펼쳐도 되지만,
                 form/input/svg는 AI 수정 시 정책상 제거되므로 AI 편집과
                 함께 쓸 수 없다 — 인라인 폼으로 바꿨다면 수동 편집만 사용할 것 -->
{{search}}

            <!-- 로그인/알림 + 유틸리티 메뉴 (PC) -->
{{login_area}}

{{menu_utility}}

            <!-- 모바일 토글 -->
            <button class="mublo-header__toggle" id="mubloPanelToggle" aria-label="메뉴 열기">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>

        </div>
    </div>
</header>

{{mobile_panel}}
